name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_animation_studio
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check .
      - run: python -m mypy app
      - run: python -m pytest
      - name: Verify Alembic migrations apply cleanly
        env:
          DATABASE_URL: postgresql+asyncpg://app_user:ci-only-password@localhost:5432/ai_animation_studio
        run: python -m alembic upgrade head
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the full stack (frontend, backend, PostgreSQL, Redis)
        run: docker compose up -d --build
      - name: Wait for the backend to report ready
        run: timeout 120 bash -c 'until curl -sf http://localhost:8000/health/ready; do sleep 3; done'
      - name: Wait for the frontend dev server
        run: timeout 60 bash -c 'until curl -sf http://localhost:5173 >/dev/null; do sleep 2; done'
      - name: Run Playwright end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Show backend logs
        if: failure()
        run: docker compose logs backend
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Tear down the stack
        if: always()
        run: docker compose down -v
